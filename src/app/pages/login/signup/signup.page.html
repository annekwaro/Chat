<ion-content [fullscreen]="true">
  <ion-spinner
    class="ion-text-centre"
    name="crescent"
    *ngIf="isLoading"
  ></ion-spinner>
  <div class="circleBase type2 circle1"></div>
  <div class="circleBase type1"></div>
  <div class="circleBase type2 circle2"></div>

  <ion-label class="welcomeMessage">
    <ion-text color="light">SignUp</ion-text>
    <ion-text color="light">
      <p>Log In</p>
    </ion-text>
  </ion-label>

  <form [formGroup]="form" class="form-container">
    <ion-list lines="none" class="ion-margin ion-padding">
      <ion-item class="ion-margin-vertical">
        <ion-icon name="mail outline" slot="end" color="medium"> </ion-icon>
        <ion-input formControlName="email" placeholder="Enter email address">
        </ion-input>
      </ion-item>
      <ion-text
        class="ion-text-left error-message"
        color="danger"
        *ngIf="!form.get('email').valid && form.get('email').touched"
      >
        <p class="error">Please enter a valid email address</p>
      </ion-text>

      <ion-item class="ion-margin-vertical">
        <ion-icon
          (click)="onChange()"
          [name]="isTypePassword ? 'lock-closed-outline' : 'lock-open-outline'"
          slot="end"
          [color]="isTypePassword ? 'medium' : 'primary'"
        ></ion-icon>
        <ion-input
          formControlName="password"
          [type]="isTypePassword ? 'password' : 'text'"
          placeholder="Enter password"
        ></ion-input>
      </ion-item>
      <ion-text
        class="ion-text-left error-message"
        color="danger"
        *ngIf="!form.get('password').valid && form.get('password').touched"
      >
        <p
          class="error"
          *ngIf="form.get('password').invalid && form.get('password').errors['required']"
        >
          *Please enter your password
        </p>
        <p class="error" *ngIf="form.get('password').dirty">
          *Password must be at least 6 characters
        </p>
      </ion-text>

      <ion-row class="ion-margin-vertical">
        <ion-col size="6" class="alignItems">
          <div align="left">
            <ion-checkbox> </ion-checkbox>
            <ion-note>Remember me</ion-note>
          </div>
        </ion-col>
        <ion-col size="6">
          <div align="right">
            <ion-checkbox> </ion-checkbox>
            <ion-note>Forgot password</ion-note>
          </div>
        </ion-col>
      </ion-row>
      <ion-button color="primary" shape="round" (click)="onSubmit()"
        >Log In</ion-button
      >
      <p class="signup">
        <ion-note>
          Not a member yet?
          <ion-text routerLink="/login/signup" color="primary">Signup</ion-text>
        </ion-note>
      </p>
    </ion-list>
  </form>
</ion-content>
