<ion-content [fullscreen]="true">
  <div class="header">
    <!--<ion-title class="title"> Welcome </ion-title>-->
    <p class="subTitle">Sign up to create an account</p>
  </div>

  <form [formGroup]="regForm">
    <div class="ion-padding">
      <ion-item>
        <ion-input formControlName="name" input placeholder="Name"></ion-input>
        <ion-icon name="person-outline"></ion-icon>
      </ion-item>
      <div
        class="error-message"
        *ngIf="regForm.controls['name'].touched && regForm.controls['name'].invalid"
      >
        <ion-text
          *ngIf="regForm.controls['name'].errors && regForm.controls['name'].errors['required']"
        >
          Name is required for registration
        </ion-text>
      </div>

      <ion-item>
        <ion-input
          formControlName="password"
          class="input"
          placeholder="Password"
        ></ion-input>
        <ion-icon name="lock-closed-outline"></ion-icon>
      </ion-item>
      <div
        class="error-message"
        *ngIf="regForm.controls['password'].touched && regForm.controls['password'].invalid"
      >
        <ion-text
          *ngIf="regForm.controls['password'].errors && regForm.controls['password'].errors['required']"
        >
          Password is required
        </ion-text>
      </div>

      <ion-item>
        <ion-input
          formControlName="email"
          class="input"
          placeholder="Email Address"
          type="email"
        ></ion-input>
        <ion-icon name="mail-outline"></ion-icon>
      </ion-item>
      <div
        class="error-message"
        *ngIf="regForm.controls['email'].touched && regForm.controls['email'].invalid"
      >
        <ion-text
          *ngIf="regForm.controls['email'].errors && regForm.controls['email'].errors['required']"
        >
          Email is required
        </ion-text>
      </div>
    </div>

    <div class="ion-padding">
      <ion-button
        (click)="signUp"
        expand="block"
        shape="round"
        color="primary"
        [routerLink]="['/tabs', 'tab1']"
        >Sign Up</ion-button
      >
    </div>
    <div class="signinLink">
      <p>Already a member? <a [routerLink]="['/', 'login']">Sign In</a></p>
    </div>
  </form>
</ion-content>
