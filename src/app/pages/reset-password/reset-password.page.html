<ion-content [fullscreen]="true">
  <div class="container">
    <ion-title class="title">
      Enter your email
      <p class="subtitle">To receive a reset password</p>
    </ion-title>
  </div>
  <div class="container">
    <ion-item class="input-item">
      <ion-input placeholder="Enter your Email"></ion-input>
      <ion-icon name="person-outline"></ion-icon>
    </ion-item>
    <ion-button
      class="submit-button"
      expand="block"
      shape="round"
      color="primary"
      [routerLink]="['/login',]"
    >
      Submit
    </ion-button>
  </div>
</ion-content>
