<ion-header class="ion-no-border">
  <ion-toolbar class="chat-bar">
    <ion-buttons slot="start">
      <ion-back-button defaultHref="/tabs/home" text=""></ion-back-button>
    </ion-buttons>
    <div class="person" *ngIf="state === 'ready'">
      <app-avatar [name]="otherName" [photo]="otherPhoto"></app-avatar>
      <h1 class="name">{{ otherName }}</h1>
    </div>
  </ion-toolbar>
</ion-header>

<ion-content class="messages">
  <div *ngIf="state === 'loading'" class="center">
    <ion-spinner name="dots"></ion-spinner>
  </div>

  <div *ngIf="state === 'missing' || state === 'error'" class="center notice">
    <ion-icon [name]="state === 'missing' ? 'chatbubbles-outline' : 'cloud-offline-outline'"></ion-icon>
    <p *ngIf="state === 'missing'">This conversation isn’t available.</p>
    <p *ngIf="state === 'error'">We couldn’t load this conversation. Check your connection and try again.</p>
    <ion-button fill="outline" routerLink="/tabs/home" routerDirection="back">Back to chats</ion-button>
  </div>

  <ng-container *ngIf="state === 'ready'">
    <div *ngIf="!messageCount" class="center notice hello">
      <app-avatar [name]="otherName" [photo]="otherPhoto"></app-avatar>
      <h2>Say hello to {{ otherName }} 👋</h2>
      <p>Be kind, and take your time. Messages are only seen by the two of you.</p>
    </div>

    <section *ngFor="let day of days" class="day">
      <div class="day-label"><span>{{ day.label }}</span></div>
      <app-chat-box
        *ngFor="let message of day.messages; trackBy: trackMessage"
        [message]="message"
        [mine]="isMine(message)"
      ></app-chat-box>
    </section>
  </ng-container>
</ion-content>

<ion-footer *ngIf="state === 'ready'" class="ion-no-border composer">
  <ion-toolbar>
    <div class="compose">
      <ion-textarea
        aria-label="Message"
        placeholder="Message"
        [(ngModel)]="text"
        [autoGrow]="true"
        [rows]="1"
        [maxlength]="maxLength"
        enterkeyhint="send"
        (keydown)="onKeydown($event)"
      ></ion-textarea>
      <ion-button
        class="send"
        shape="round"
        aria-label="Send message"
        [disabled]="!canSend"
        (click)="send()"
      >
        <ion-icon slot="icon-only" name="send"></ion-icon>
      </ion-button>
    </div>
  </ion-toolbar>
</ion-footer>
