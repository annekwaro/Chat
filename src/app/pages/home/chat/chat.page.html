<ion-header>
  <ion-toolbar color="primary">
    <ion-title>Chat</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content>
  <div *ngFor="let msg of messages">
    <p>
      <strong>{{ msg.senderId === currentUserId ? 'Me' : 'Other' }}:</strong> {{
      msg.text }}
    </p>
    <small>{{ msg.timestamp | date:'shortTime' }}</small>
  </div>
</ion-content>

<ion-footer>
  <ion-toolbar>
    <ion-input
      placeholder="Type a message..."
      [(ngModel)]="messageText"
    ></ion-input>
    <ion-button (click)="sendMessage()">Send</ion-button>
  </ion-toolbar>
</ion-footer>
