<ion-content>
  <div class="landing">
    <div class="brand-row">
      <span class="brand" aria-hidden="true"><ion-icon name="leaf"></ion-icon></span>
      <span class="brand-name">Soul App</span>
    </div>

    <swiper-container
      class="intro"
      grab-cursor="true"
      [modules]="swiperModules"
      slides-per-view="1"
      keyboard="true"
      rewind="true"
      autoplay-delay="3500"
      pagination="true"
    >
      <swiper-slide *ngFor="let slide of slides">
        <div class="art" [style.background]="slide.tint">
          <img [src]="slide.image" alt="" />
        </div>
        <h1>{{ slide.title }}</h1>
        <p>{{ slide.text }}</p>
      </swiper-slide>
    </swiper-container>

    <div class="actions">
      <!-- No sign-up needed: guests get a session and can create an account later -->
      <ion-button
        class="get-started"
        shape="round"
        expand="block"
        [routerLink]="['/tabs/tab1']"
        [replaceUrl]="true"
        >Commencer</ion-button
      >
      <ion-button class="have-account" fill="clear" expand="block" [routerLink]="['/login2']"
        >J’ai déjà un compte</ion-button
      >
    </div>
  </div>
</ion-content>
