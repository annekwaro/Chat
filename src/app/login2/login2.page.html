<ng-container *transloco="let t">
<ion-header class="ion-no-border">
  <ion-toolbar>
    <ion-buttons slot="start">
      <ion-back-button defaultHref="/landing" [text]="t('common.back')"></ion-back-button>
    </ion-buttons>
  </ion-toolbar>
</ion-header>

<ion-content>
  <div class="brand" aria-hidden="true"><ion-icon name="leaf"></ion-icon></div>
  <h1 class="title">{{ t('login.title') }}</h1>
  <p class="subtitle">{{ t('login.subtitle') }}</p>

  <form [formGroup]="loginForm" (ngSubmit)="login()">
    <ion-item class="field" lines="none">
      <ion-icon slot="start" name="mail-outline" aria-hidden="true"></ion-icon>
      <ion-input
        [label]="t('auth.email')"
        labelPlacement="floating"
        formControlName="email"
        type="email"
        autocomplete="email"
      ></ion-input>
    </ion-item>
    <p class="field-error" *ngIf="loginForm.get('email').invalid && loginForm.get('email').touched">
      <ion-icon name="alert-circle-outline"></ion-icon> {{ t('auth.emailInvalid') }}
    </p>

    <ion-item class="field" lines="none">
      <ion-icon slot="start" name="lock-closed-outline" aria-hidden="true"></ion-icon>
      <ion-input
        [label]="t('auth.password')"
        labelPlacement="floating"
        formControlName="password"
        [type]="showPassword ? 'text' : 'password'"
        autocomplete="current-password"
      ></ion-input>
      <ion-button
        slot="end"
        fill="clear"
        class="reveal"
        [attr.aria-label]="t(showPassword ? 'auth.hidePassword' : 'auth.showPassword')"
        (click)="showPassword = !showPassword"
      >
        <ion-icon slot="icon-only" [name]="showPassword ? 'eye-off-outline' : 'eye-outline'"></ion-icon>
      </ion-button>
    </ion-item>
    <p class="field-error" *ngIf="loginForm.get('password').invalid && loginForm.get('password').touched">
      <ion-icon name="alert-circle-outline"></ion-icon> {{ t('login.passwordTooShort') }}
    </p>
    <div class="forgot">
      <ion-button fill="clear" size="small" (click)="forgotPassword()">{{ t('login.forgot') }}</ion-button>
    </div>

    <p class="form-error" *ngIf="errorKey" role="alert">{{ t(errorKey) }}</p>

    <ion-button
      class="submit"
      shape="round"
      type="submit"
      expand="block"
      [disabled]="!loginForm.valid || isLoading"
    >
      {{ t(isLoading ? 'login.submitting' : 'login.submit') }}
    </ion-button>
  </form>

  <p class="switch">
    {{ t('login.newHere') }}
    <a [routerLink]="['/signup2']" [queryParams]="{ returnUrl: returnUrl }">{{ t('login.createAccount') }}</a>
  </p>
  <ion-button class="skip" fill="clear" expand="block" color="medium" (click)="continueWithoutAccount()">
    {{ t('login.skip') }}
  </ion-button>
</ion-content>
</ng-container>
