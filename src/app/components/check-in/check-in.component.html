<ion-header class="ion-no-border">
  <ion-toolbar>
    <ion-title>Mon humeur du jour</ion-title>
    <ion-buttons slot="end">
      <ion-button (click)="close()">Fermer</ion-button>
    </ion-buttons>
  </ion-toolbar>
</ion-header>

<ion-content class="ion-padding">
  <h2 class="question">Comment vous sentez-vous aujourd’hui&nbsp;?</h2>
  <div class="faces" role="radiogroup" aria-label="Humeur">
    <button
      *ngFor="let mood of moods"
      type="button"
      class="face"
      role="radio"
      [attr.aria-checked]="selected === mood"
      [class.active]="selected === mood"
      [style.--ring]="mood.color"
      (click)="selected = mood"
    >
      <app-mood-face [mood]="mood"></app-mood-face>
      <span>{{ mood.label }}</span>
    </button>
  </div>

  <ng-container *ngIf="selected">
    <p class="message" [style.background]="selected.tint">{{ selected.message }}</p>
    <button *ngIf="selected.score <= 2" type="button" class="help-link" (click)="getHelp()">
      <ion-icon name="heart-outline"></ion-icon> Besoin de parler à quelqu’un maintenant&nbsp;?
    </button>

    <h3 class="label">Avec qui étiez-vous&nbsp;? <span>(facultatif)</span></h3>
    <div class="company">
      <ion-chip
        *ngFor="let c of company"
        [outline]="!withWhom.has(c.key)"
        [color]="withWhom.has(c.key) ? 'primary' : 'medium'"
        (click)="toggleCompany(c.key)"
      >
        <ion-icon *ngIf="withWhom.has(c.key)" name="checkmark"></ion-icon>
        <ion-label>{{ c.label }}</ion-label>
      </ion-chip>
    </div>

    <h3 class="label">Quelque chose en tête&nbsp;? <span>(facultatif)</span></h3>
    <ion-textarea
      class="note"
      aria-label="Note"
      placeholder="Que s’est-il passé aujourd’hui&nbsp;? Qu’avez-vous ressenti&nbsp;?"
      [(ngModel)]="note"
      [autoGrow]="true"
      [rows]="3"
      [maxlength]="1000"
    ></ion-textarea>
  </ng-container>

  <p *ngIf="error" class="error" role="alert">{{ error }}</p>
</ion-content>

<ion-footer class="ion-no-border">
  <ion-toolbar>
    <ion-button class="save" expand="block" shape="round" [disabled]="!selected || saving" (click)="save()">
      {{ saving ? 'Enregistrement…' : entry ? 'Mettre à jour' : 'Enregistrer' }}
    </ion-button>
  </ion-toolbar>
</ion-footer>
